[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/mcp_server", "src/simuscan", "src/simuscan_tools"]

[project]
name = "simuscanagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.6.0",
    "fastmcp>=3.2.0",
    "gwyfile>=0.3.0",
    "ipywidgets>=8.1.0",
    "markdown>=3.10.2",
    "matplotlib>=3.10.8",
    "nanosurf>=1.13.7",
    "numpy>=2.4.3",
    "openai>=2.29.0",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.2",
    "pillow>=12.1.1",
    "pymupdf>=1.27.2.3",
    "pyqt6>=6.11.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "trimesh>=4.11.5",
    "ultralytics>=8.4.36",
    "umap-learn>=0.5.12",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.66.0",
    "mcp>=1.0.0",
]

# ── PyTorch GPU (CUDA) on Windows ───────────────────────────────────────────
# On Windows the default PyPI torch wheel is CPU-only. Route torch/torchvision
# to the PyTorch cu124 index so `uv sync` installs the CUDA build.
# cu124 is compatible with CUDA driver >= 12.4 (this machine: 12.5, RTX 2000 Ada).
# Linux keeps the default PyPI resolution (it already pulls CUDA deps there).
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
