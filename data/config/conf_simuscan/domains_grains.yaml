- label: grain                                # Grain / domain field — see the domains_conf section
  shape: domains                              # Self-rendered: no entry needed in `shapes:`
  category: domains
  enable: true                                # Enabled: every image is a grain mosaic
  domains_mode:                               # Empty = use domains_conf.mode; set here to override per object
  probability: 1.0                            # Probability the grain field appears in an image
  height: [0.8, 1.0]                          # Target relief of the grain field (z_mode: relative)
  # The parameters below are not used by the domains renderer (geometry, size,
  # texture and colony settings all live in `domains_conf:`), but ObjectConfig
  # is a flat dataclass so they are listed here for completeness.
  n_objects: 0                                # Unused: the grain count follows from the field of view
  max_overlap: 1.0                            # Unused: grains come out already disjoint
  size_shape: [0, 0]                          # Unused: see domains_conf.mean_grain_size_nm
